<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monday-Zira-Sync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">Board View</p>
        <h1>Monday-Zira-Sync</h1>
        <p class="subtitle">
          Select your Jira account and destination project for this board.
        </p>

        <div class="board-meta">
          <span>Board ID:</span>
          <strong id="boardIdLabel">Detecting...</strong>
        </div>

        <label for="targetLanguageSelect">Translate Jira name to</label>
        <select id="targetLanguageSelect">
          <option value="none">No translation</option>
          <option value="en">English</option>
          <option value="de">German</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="it">Italian</option>
          <option value="nl">Dutch</option>
          <option value="pl">Polish</option>
          <option value="pt">Portuguese</option>
          <option value="sv">Swedish</option>
          <option value="da">Danish</option>
          <option value="no">Norwegian</option>
          <option value="fi">Finnish</option>
          <option value="cs">Czech</option>
          <option value="sk">Slovak</option>
          <option value="sl">Slovenian</option>
          <option value="hr">Croatian</option>
          <option value="hu">Hungarian</option>
          <option value="ro">Romanian</option>
          <option value="bg">Bulgarian</option>
          <option value="el">Greek</option>
          <option value="tr">Turkish</option>
        </select>

        <label for="accountSelect">Jira account</label>
        <select id="accountSelect" disabled>
          <option value="">Loading accounts...</option>
        </select>

        <label for="projectSelect">Jira project (space)</label>
        <select id="projectSelect" disabled>
          <option value="">Select an account first</option>
        </select>

        <fieldset class="rule-box">
          <legend>Sync rule</legend>

          <label for="syncTriggerSelect">When should sync run?</label>
          <select id="syncTriggerSelect">
            <option value="manual">Only manual sync/webhook tests</option>
            <option value="status_change">When status changes</option>
          </select>

          <label for="statusColumnIdInput">Status column ID</label>
          <select id="statusColumnIdInput">
            <option value="">Loading status columns...</option>
          </select>

          <label for="triggerStatusLabelInput">Trigger status label (optional)</label>
          <select id="triggerStatusLabelInput">
            <option value="">Any status label</option>
          </select>

          <label class="checkbox-row" for="keepSyncedCheckbox">
            <input id="keepSyncedCheckbox" type="checkbox" checked />
            <span>Keep synced after first issue creation</span>
          </label>
        </fieldset>

        <fieldset class="rule-box">
          <legend>Field mapping</legend>

          <label for="nameSourceSelect">Jira issue name source</label>
          <select id="nameSourceSelect">
            <option value="item_name">Monday item name</option>
            <option value="text_column">Specific text column</option>
          </select>

          <label for="nameColumnIdSelect">Name column</label>
          <select id="nameColumnIdSelect">
            <option value="">Select name column</option>
          </select>

          <label for="nameTranslationsInput">Name translation rules (JSON, optional)</label>
          <textarea
            id="nameTranslationsInput"
            rows="4"
            placeholder='{"AX":"Axopar","NB":"Neuboot"}'
          ></textarea>

          <label for="attachmentSourceSelect">Attachment source</label>
          <select id="attachmentSourceSelect">
            <option value="item_assets">All item files/images</option>
            <option value="file_column">Specific file column</option>
          </select>

          <label for="attachmentColumnIdSelect">Attachment file column</label>
          <select id="attachmentColumnIdSelect">
            <option value="">Select file column</option>
          </select>
        </fieldset>

        <button id="saveButton" type="button" disabled>Save board mapping</button>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/monday-sdk-js/dist/main.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
